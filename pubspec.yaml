name: home_service
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  animate_do: ^2.0.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.5.0
  provider: ^6.0.0
  intl: ^0.19.0
  smooth_page_indicator: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.13.1
  

flutter:
  uses-material-design: true
  assets:
  - assets/
  - assets/service/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/homlypro_logo2.png"  
  